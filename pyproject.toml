[project]
name = "paf"
version = "0.7.0"
description = "Parallel Codex orchestration for mathematical formalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lean-lsp-mcp==0.29.0",
  "orjson>=3.11.0",
  "rich>=14.0.0",
  "starlette>=0.47.0",
  "uvicorn>=0.35.0",
  "xxhash>=3.8.1",
]

[project.scripts]
paf = "paf.cli:main"
paf-tui = "paf.tui:main"

[dependency-groups]
dev = [
  "dprint-py>=0.55.2.0",
  "httpx2>=2.9.0",
  "pre-commit>=4.0.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
  "ty>=0.0.1a16",
]

[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "paf._rust_tui"
features = ["pyo3/extension-module"]
include = ["src/paf/prompts/*.md", "src/paf/lean/*.lean", "src/paf/web_dist/**"]
strip = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
