[project]
name = "paf"
version = "0.7.0"
description = "Parallel Codex orchestration for mathematical formalization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lean-lsp-mcp==0.29.0",
  "orjson>=3.11.0",
  "starlette>=0.47.0",
  "textual>=6.0.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
paf = "paf.cli:main"

[dependency-groups]
dev = [
  "dprint-py>=0.55.2.0",
  "httpx2>=2.9.0",
  "pre-commit>=4.0.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12.0",
  "ty>=0.0.1a16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# These non-Python resources are runtime inputs. The ignored frontend bundle is
# generated before a release build; listing it as an artifact includes it in
# wheels and source distributions without committing it to Git.
artifacts = [
  "src/paf/prompts/*.md",
  "src/paf/web_dist/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paf"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src/paf",
]

[tool.pytest.ini_options]
addopts = "-q -n 4 --dist=worksteal"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
